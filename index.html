<style>
/* Layout: a case file read top to bottom. A stage bar picks one of three cases (3, 6, then 9 statement cards). Below it: brief, rules and reading tips, the cards with a three-way speaker switch and a hypothesis bar, then a verdict panel. A stopped clock appears only in the last case and starts running when it is solved. */
:root {
  --bg: #E8ECF1;
  --surface: #F6F8FA;
  --ink: #172033;
  --muted: #566277;
  --line: #C2CAD7;
  --brass: #86560F;
  --cat: #6B3FA0;
  --dog: #0C6B6B;
  --rabbit: #AE3459;
  --pigeon: #1F5FA8;
  --fox: #4D7C0F;
  --ok: #1B7449;
  --bad: #B3261E;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1422;
    --surface: #18203A;
    --ink: #E6EAF2;
    --muted: #9AA6BC;
    --line: #2D3857;
    --brass: #E3B25C;
    --cat: #BA9CF2;
    --dog: #5CCBC4;
    --rabbit: #F29AB2;
    --pigeon: #8DB8F5;
    --fox: #A3D45F;
    --ok: #6CD39A;
    --bad: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1422;
  --surface: #18203A;
  --ink: #E6EAF2;
  --muted: #9AA6BC;
  --line: #2D3857;
  --brass: #E3B25C;
  --cat: #BA9CF2;
  --dog: #5CCBC4;
  --rabbit: #F29AB2;
  --pigeon: #8DB8F5;
  --fox: #A3D45F;
  --ok: #6CD39A;
  --bad: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
h1, h2 { font-family: var(--font-display); font-weight: 900; text-wrap: balance; margin: 0; line-height: 1.3; }
h2 { font-size: 1.35rem; }
p { margin: 0; }
.mono { font-family: var(--font-mono); letter-spacing: 0.06em; }
.label { font-size: 0.75rem; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); font-size: 0.9rem; }

/* stage bar */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stage { font: inherit; text-align: left; padding: 10px 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.stage .s-no { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; color: var(--muted); }
.stage .s-name { font-family: var(--font-display); font-weight: 900; font-size: 1.05rem; line-height: 1.4; }
.stage .s-sub { font-size: 0.78rem; color: var(--muted); }
.stage[aria-current="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--brass) 12%, var(--surface)); }
.stage.done .s-sub { color: var(--ok); font-weight: 700; }
.stage:disabled { opacity: 0.45; cursor: not-allowed; }
.stage:hover:not(:disabled):not([aria-current="true"]) { border-color: var(--brass); }

/* header */
.head { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 24px; }
.head-text { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: clamp(2rem, 7vw, 2.9rem); letter-spacing: 0.04em; }
.status-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
.stamp { display: inline-block; border: 2px solid var(--bad); color: var(--bad); font-weight: 900; padding: 0 10px; letter-spacing: 0.2em; transform: rotate(-3deg); font-family: var(--font-display); }
.stamp.solved { border-color: var(--ok); color: var(--ok); }
.clock { width: 132px; height: 132px; flex: none; }
.clock circle.face { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.clock .tick { stroke: var(--muted); stroke-width: 2; }
.clock .hand { stroke: var(--ink); stroke-linecap: round; transform-origin: 60px 60px; transition: transform 1.6s cubic-bezier(.3,.7,.2,1); }
.clock .hour { stroke-width: 5; }
.clock .minute { stroke-width: 3.5; }
.clock .second { stroke: var(--brass); stroke-width: 1.5; opacity: 0; }
.clock .pin { fill: var(--brass); }
.clock.running .hour { transform: rotate(3deg); }
.clock.running .minute { transform: rotate(38deg); }
.clock.running .second { opacity: 1; animation: sweep 60s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }

/* brief */
.brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 32px; }
.brief > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rules li { padding-left: 14px; border-left: 3px solid var(--line); }
.rules.tips li { border-left-color: var(--brass); }
.rules b { font-weight: 700; }
.t-cat { color: var(--cat); } .t-dog { color: var(--dog); } .t-rabbit { color: var(--rabbit); } .t-pigeon { color: var(--pigeon); } .t-fox { color: var(--fox); }
.sub { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-weight: 400; }
.facts { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* board */
.board-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { border: 1px solid var(--line); background: var(--surface); padding: 2px 12px; font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.count.full { border-color: currentColor; }
.hyp { margin-top: 12px; padding: 10px 14px; border: 1px dashed var(--muted); display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.hyp.on { border-color: var(--brass); border-style: solid; background: color-mix(in srgb, var(--brass) 10%, var(--surface)); }
.hyp .btn { padding: 4px 14px; font-size: 0.9rem; }
.hyp-text { flex: 1 1 220px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.a-cat { background: color-mix(in srgb, var(--cat) 12%, var(--surface)); border-color: var(--cat); }
.card.a-dog { background: color-mix(in srgb, var(--dog) 12%, var(--surface)); border-color: var(--dog); }
.card.a-rabbit { background: color-mix(in srgb, var(--rabbit) 12%, var(--surface)); border-color: var(--rabbit); }
.card.a-pigeon { background: color-mix(in srgb, var(--pigeon) 12%, var(--surface)); border-color: var(--pigeon); }
.card.a-fox { background: color-mix(in srgb, var(--fox) 12%, var(--surface)); border-color: var(--fox); }
.card.tentative { border-style: dashed; border-width: 2px; padding: 13px 15px 15px; }
.card-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.num { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; line-height: 1; color: var(--brass); }
.card-id { font-size: 0.72rem; color: var(--muted); }
.tag.fixed { margin-left: auto; color: var(--bg); background: var(--brass); }
.tag + .tag { margin-left: 0; }
.tag { margin-left: auto; font-size: 0.75rem; font-weight: 700; color: var(--brass); border: 1px solid var(--brass); padding: 0 8px; line-height: 1.6; }
.said { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; line-height: 1.6; margin: 0; text-wrap: pretty; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); border: 1px solid var(--line); background: var(--bg); }
.seg button { font: inherit; font-size: 0.9rem; font-weight: 700; padding: 8px 4px; background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(:disabled):not([aria-pressed="true"]) { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button:disabled { opacity: 0.35; cursor: not-allowed; }
.seg button[aria-pressed="true"] { color: var(--bg); opacity: 1; }
.seg button[data-a="cat"][aria-pressed="true"] { background: var(--cat); }
.seg button[data-a="dog"][aria-pressed="true"] { background: var(--dog); }
.seg button[data-a="rabbit"][aria-pressed="true"] { background: var(--rabbit); }
.seg button[data-a="pigeon"][aria-pressed="true"] { background: var(--pigeon); }
.seg button[data-a="fox"][aria-pressed="true"] { background: var(--fox); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* verdict */
.verdict { border: 2px solid var(--ink); background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.check { font-weight: 700; display: flex; gap: 10px; align-items: center; }
.check::before { content: ""; width: 12px; height: 12px; background: var(--muted); flex: none; }
.check.good::before { background: var(--ok); } .check.good { color: var(--ok); }
.check.warn::before { background: var(--bad); } .check.warn { color: var(--bad); }
.strict { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; cursor: pointer; }
.strict input { margin-top: 5px; width: 16px; height: 16px; flex: none; accent-color: var(--brass); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; padding: 10px 20px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.msg { min-height: 1.75em; }
.msg.bad { color: var(--bad); font-weight: 700; }
.hints { display: flex; flex-direction: column; gap: 8px; }
.hint { padding: 8px 12px; border-left: 3px solid var(--brass); background: color-mix(in srgb, var(--brass) 10%, var(--surface)); }
.hint b { font-family: var(--font-mono); margin-right: 6px; color: var(--brass); }

/* truth */
.truth { border: 2px solid var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.truth h2 { color: var(--ok); }
.truth-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.truth-list li { padding-left: 14px; border-left: 3px solid var(--ok); }
.coda { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.truth .btn { align-self: flex-start; }
.masthead { margin: 0; display: flex; align-items: baseline; gap: 12px; }
.mh-title { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; letter-spacing: 0.08em; }
.mh-sub { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; }
.scene { border: 1px solid var(--line); background: var(--surface); padding: 12px 16px; }
.scene > summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.15em; color: var(--muted); }
.scene .lines { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ln { margin: 0; }
.ln-n { color: var(--muted); font-style: italic; }
.ln b { font-family: var(--font-mono); font-size: 0.75rem; margin-right: 8px; letter-spacing: 0.1em; color: var(--brass); }
.ln-y b { color: var(--muted); }
.epilogue { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
.card.flag, article.flag { outline: 3px solid var(--brass); outline-offset: 2px; }
.grumble { display: block; color: var(--muted); font-style: italic; margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) {
  .clock .hand { transition: none; }
  .clock.running .second { animation: none; }
}

/* ---- visual novel scenes ---- */
:root {
  --vn-ink: #F3EEE2;
  --vn-ink-dim: #B9B2A2;
  --vn-box: rgba(12, 14, 26, 0.86);
  --vn-line: #C79A4B;
  --vn-cat: #0B0C12;
  --vn-chair: #3A2A2A;
  --vn-eye: #F2C84B;
}
.truth-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.scene-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.scene-bar .label { margin-right: 4px; }
.vn { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; color: var(--vn-ink); font-family: var(--font-body); }
.vn[hidden] { display: none; }
.vn-bg { position: absolute; inset: 0; background: linear-gradient(180deg, var(--vn-sky1), var(--vn-sky2) 62%, var(--vn-floor) 62%, var(--vn-floor2)); transition: background 0.6s; }
.vn[data-bg="day"] .vn-bg { background: url(img/bg_day.webp) 55% center / cover no-repeat, linear-gradient(180deg, var(--vn-sky1), var(--vn-floor2)); }
.vn[data-bg="morn"] .vn-bg { background: url(img/bg_morn.webp) 55% center / cover no-repeat, linear-gradient(180deg, var(--vn-sky1), var(--vn-floor2)); }
.vn[data-bg="dusk"] .vn-bg { background: url(img/bg_dusk.webp) 55% center / cover no-repeat, linear-gradient(180deg, var(--vn-sky1), var(--vn-floor2)); }
.vn[data-bg="night"] .vn-bg { background: url(img/bg_night.webp) 55% center / cover no-repeat, linear-gradient(180deg, var(--vn-sky1), var(--vn-floor2)); }
.vn-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(6, 8, 18, 0.5)); }
.vn-window { display: none; }
.vn[data-bg="day"] { --vn-sky1: #F4D7A1; --vn-sky2: #E8B96E; --vn-floor: #6B4A33; --vn-floor2: #3A2A20; --vn-win: #FFF2C9; }
.vn[data-bg="morn"] { --vn-sky1: #BFD6E6; --vn-sky2: #E9E2D0; --vn-floor: #5C4A3C; --vn-floor2: #33291F; --vn-win: #F4FBFF; }
.vn[data-bg="dusk"] { --vn-sky1: #7A4E6B; --vn-sky2: #E08A5C; --vn-floor: #4A3238; --vn-floor2: #231A20; --vn-win: #FFC98A; }
.vn[data-bg="night"] { --vn-sky1: #0E1430; --vn-sky2: #27335E; --vn-floor: #2A2430; --vn-floor2: #14111A; --vn-win: #8EA2D8; }
.vn-window { position: absolute; top: 9%; left: 50%; width: min(46vw, 360px); height: 34%; transform: translateX(-130%); border: 6px solid rgba(20, 14, 10, 0.75); background: var(--vn-win); opacity: 0.9; box-shadow: 0 0 80px 10px color-mix(in srgb, var(--vn-win) 45%, transparent); }
.vn-window::before, .vn-window::after { content: ""; position: absolute; background: rgba(20, 14, 10, 0.75); }
.vn-window::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
.vn-window::after { top: 50%; left: 0; right: 0; height: 6px; transform: translateY(-50%); }
.vn-cat { position: absolute; bottom: 168px; left: 50%; width: min(60vw, 330px); transform: translateX(-50%); transition: filter 0.3s, opacity 0.3s; pointer-events: none; }
.vn-cat { --gap: 2.5%; }
.vn-cat[data-pose="sleep"] { --gap: 9.8%; }
.vn-cat[data-pose="awake"] { --gap: 2.1%; }
.vn-cat[data-pose="stand"] { --gap: 9.5%; }
.vn-cat img { display: block; width: 100%; height: auto; transform: translateY(var(--gap)); filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
.vn-cat.dim { filter: brightness(0.6); }
@keyframes vn-breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }
.vn-title { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 14vh; gap: 10px; text-align: center; background: rgba(6, 8, 18, 0.55); }
.vn.is-title .vn-title { display: flex; }
.vn.is-title .vn-box { display: none; }
.vn-title h2 { margin: 0; font-family: var(--font-display); font-size: clamp(2rem, 8vw, 3.6rem); letter-spacing: 0.18em; font-weight: 900; color: var(--vn-ink); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6); }
.vn-title p { margin: 0; font-family: var(--font-mono); letter-spacing: 0.3em; font-size: 0.8rem; color: var(--vn-ink-dim); }
.vn-title .btn { margin-top: 18px; }
.vn-box { position: relative; margin: 0 auto 16px; width: calc(100% - 32px); max-width: 760px; min-height: 150px; padding: 16px 20px 28px; border: 1px solid var(--vn-line); background: var(--vn-box); cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: inherit; }
.vn-box:focus-visible { outline: 3px solid var(--vn-line); outline-offset: 3px; }
.vn-name { align-self: flex-start; font-family: var(--font-mono); letter-spacing: 0.15em; font-size: 0.8rem; padding: 2px 10px; background: var(--vn-line); color: #17110A; font-weight: 700; }
.vn-name[hidden] { display: none; }
.vn-text { display: block; margin: 0; font-size: 1.05rem; line-height: 1.9; min-height: 3.8em; }
.vn-text.narr { color: var(--vn-ink-dim); font-style: italic; }
.vn-next { position: absolute; right: 16px; bottom: 8px; color: var(--vn-line); animation: vn-blink 1.1s steps(2) infinite; }
.vn-count { position: absolute; left: 20px; bottom: 8px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--vn-ink-dim); }
@keyframes vn-blink { 50% { opacity: 0.15; } }
.vn-skip { position: absolute; top: 12px; right: 118px; background: rgba(12, 14, 26, 0.7); color: var(--vn-ink); border: 1px solid var(--vn-line); padding: 8px 14px; font: inherit; font-size: 0.85rem; cursor: pointer; }
.vn-skip:focus-visible { outline: 3px solid var(--vn-line); outline-offset: 2px; }
.vn-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 560px) { .vn-cat { bottom: 172px; width: 70vw; } .vn-window { transform: translateX(-85%); } }
@media (prefers-reduced-motion: reduce) { .vn-next { animation: none; } }
.ask { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(6, 8, 18, 0.7); }
.ask[hidden] { display: none; }
.ask-box { max-width: 22em; width: 100%; padding: 20px; border-radius: 12px; background: var(--surface, #1b1e2e); color: var(--ink, inherit); border: 1px solid var(--line, #8886); text-align: center; }
.ask-box p { margin: 0 0 16px; line-height: 1.7; }
.ask-btns { display: flex; gap: 12px; justify-content: center; }
.ask-btns .btn { min-width: 7em; min-height: 44px; }
.ov-open { padding: 4px 14px; font-size: 0.9rem; border-width: 1px; }

const VOICE = { S: 1, SD: 1, SS: 1 };
function voiceTruth(card, asg) {
  if (card.kind === 'S') {
    const s = asg[card.ref];
    return s ? (s === card.animal) === card.pos : undefined;
  }
  if (card.kind === 'SD') {
    const s = asg[card.ref];
    return s ? card.set.includes(s) === card.pos : undefined;
  }
  const a = asg[card.refs[0]], b = asg[card.refs[1]];
  return a && b ? (a === b) === card.same : undefined;
}
// does the statement written on the card hold in this world? (undefined: not decided yet)
function contentTruth(card, world, asg) {
  if (card.kind === 'TV') {
    const t = contentTruth(card.tg, world, asg);
    return t === undefined ? undefined : (card.claimFalse ? !t : t);
  }
  if (VOICE[card.kind]) return voiceTruth(card, asg);
  if (card.kind === 'ON') return card.t < world.T;
  if (card.kind === 'OFF') return card.t >= world.T;
  if (card.kind === 'CS') return card.set.includes(world.C) === card.pos;
  return (world[card.key] === card.val) === card.pos;
}
// cards whose speaker decides whether this card's statement can be judged
function depsOf(card) {
  if (card.kind === 'SS') return card.refs;
  if (VOICE[card.kind]) return [card.ref];
  if (card.kind === 'TV') return depsOf(card.tg);
  return [];
}
function cardOk(card, speaker, world, asg) {
  const truth = contentTruth(card, world, asg);
  if (truth === undefined) return true;
  if (speaker === 'cat') return !truth;
  if (speaker === 'dog') return truth;
  if (speaker === 'pigeon') {
    const late = card.time !== undefined && card.time > world.T;
    return late ? !truth : truth;
  }
  if (speaker === 'fox') {
    const f = world.F;
    const lie = f === 'voice' ? !!VOICE[card.kind] : f === 'other' ? !VOICE[card.kind] : card.text.includes('イヌ');
    return lie ? !truth : truth;
  }
  return card.mentionsCat ? !truth : truth;
}
function consistentWorlds(st, asg) {
  return st.worlds.filter(w => st.cards.every(c => !asg[c.id] || cardOk(c, asg[c.id], w, asg)));
}
function countsOf(st, asg) {
  const n = {};
  st.animals.forEach(a => { n[a] = 0; });
  for (const c of st.cards) if (asg[c.id]) n[asg[c.id]]++;
  return n;
}
// every full assignment (per cards each) that fits some version of the truth
function validFor(st) {
  if (st._valid) return st._valid;
  if (st.answer) { st._valid = [st.answer]; return st._valid; }
  const N = st.cards.length, out = [], cur = [], left = {};
  st.animals.forEach(a => { left[a] = st.per; });
  (function rec(i) {
    if (i === N) {
      const asg = {};
      cur.forEach((a, k) => { asg[k + 1] = a; });
      if (consistentWorlds(st, asg).length) out.push(asg);
      return;
    }
    for (const a of st.animals) {
      if (left[a] > 0) { left[a]--; cur[i] = a; rec(i + 1); left[a]++; }
    }
  })(0);
  st._valid = out;
  return out;
}

function completable(st, asg) {
  return validFor(st).some(sol => st.cards.every(c => !asg[c.id] || asg[c.id] === sol[c.id]));
}

$('scene').addEventListener('click', e => {
  const b = e.target.closest('button[data-vn]');
  if (b) vnOpen(STAGES[state.cur].no, b.dataset.vn, false);
});
function autoScene() {
  const st = STAGES[state.cur], ss = state.s[state.cur];
  if (ss.solved || seen['pre' + st.no]) return;
  vnOpen(st.no, 'pre', false);
}

function setStage(i, scrollTop) {
  if (!unlocked(i)) return;
  state.cur = i;
  clearTimeout(state.postTimer); clearTimeout(state.postTimer2); clearTimeout(state.postTimer3);
  clearMsg();
  render();
  if (scrollTop) window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
  puzzleBgm();
  autoScene();
}

$('stages').addEventListener('click', e => {
  const b = e.target.closest('button[data-stage]');
  if (!b || b.disabled) return;
  setStage(+b.dataset.stage, false);
});

$('cards').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b || b.disabled) return;
  const ss = curState(), id = +b.dataset.id, a = b.dataset.a;
  AUD.play(ss.asg[id] === a ? 'card_remove' : 'card_place', 0.7);
  ss.asg[id] = ss.asg[id] === a ? undefined : a;
  clearMsg();
  render('button[data-id="' + id + '"][data-a="' + a + '"]');
});
$('hyp').addEventListener('click', e => {
  const b = e.target.closest('button[data-hyp]');
  if (!b) return;
  const ss = curState(), act = b.dataset.hyp;
  if (act === 'start') ss.snap = Object.assign({}, ss.asg);
  else if (act === 'commit') ss.snap = null;
  else if (act === 'cancel') { ss.asg = Object.assign({}, ss.snap); ss.snap = null; }
  clearMsg();
  render('button[data-hyp]');
});

$('strict').addEventListener('change', e => { state.strict = e.target.checked; render(); });

function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.9, 1.8].forEach((t, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 392 : 523.25;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 1.6);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 1.7);
    });
  } catch (err) { /* sound is optional */ }
}

$('solve').addEventListener('click', () => {
  const i = state.cur, st = STAGES[i], ss = curState();
  if (consistentWorlds(st, ss.asg).length === 0) {
    $('msg').className = 'msg bad';
    $('msg').textContent = 'この割り当てでは、どんな真相でも証言が噛み合わない。どこかを入れ替えてみよう。';
    return;
  }
  clearMsg();
  ss.solved = true;
  ss.retry = false;
  state.cleared[i] = true;
  saveProgress();
  render();
  AUD.bgm(null);
  const jg = AUD.play('jingle_solved', 1);
  setTimeout(() => $('truth').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }), 300);
  // the aftermath scene is opened by the player (tap), so the answer can be read in peace
  let back = false;
  const resume = () => { if (back) return; back = true; if (state.cur === i && !VN.active) puzzleBgm(); };
  if (jg) {
    jg.addEventListener('ended', resume, { once: true });
    jg.addEventListener('error', resume, { once: true });
    setTimeout(resume, 15000); // safety net: the jingle never reported its end
  } else setTimeout(resume, 1200);
});

$('truth').addEventListener('click', e => {
  if (e.target.closest('#to-post')) vnOpen(STAGES[state.cur].no, 'post', false);
  if (e.target.closest('#next')) setStage(state.cur + 1, true);
});

$('hint').addEventListener('click', async () => {
  const ss = curState();
  const HL = STAGES[state.cur].hints.length;
  if (ss.hints >= HL) return;
  clearMsg();
  if (ss.hints === HL - 1 && !(await askConfirm('答えを、ほぼそのまま教えてもらいます。いいですか？', '聞く'))) return;
  ss.hints++; AUD.play('meow_hint', 0.9); render();
  requestAnimationFrame(() => { const ps = $('hints').querySelectorAll('.hint'); const last = ps[ps.length - 1]; if (last) last.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }); });
});

$('diag-btn').addEventListener('click', () => {
  const i = state.cur, st = STAGES[i], ss = curState();
  clearMsg();
  const sol = validFor(st)[0];
  const placed = st.cards.filter(c => ss.asg[c.id]);
  const wrong = placed.filter(c => sol && ss.asg[c.id] !== sol[c.id]);
  let pick = null;
  if (wrong.length) {
    // prefer a card whose removal clears a contradiction, so the pointer feels like a real clue
    const broken = consistentWorlds(st, ss.asg).length === 0;
    if (broken) pick = wrong.find(c => { const t = Object.assign({}, ss.asg); delete t[c.id]; return consistentWorlds(st, t).length > 0; });
    pick = pick || wrong[0];
  }
  AUD.play('meow_hint', 0.9);
  const d = $('diag');
  d.hidden = false;
  d.innerHTML = '<span class="grumble">' + (pick ? '…寝かせてもくれんのか。' : '…まあ、見るだけなら構わん。') + '</span>' +
    (!placed.length ? '何も置いていないのに、間違いも何もない。'
      : pick ? String.fromCharCode(0x2460 + pick.id - 1) + 'の話者が、違っている。どこがおかしいかは、自分で考えろ。'
      : '今、置いてあるものに、間違いは見当たらん。…今のところは、な。');
  requestAnimationFrame(() => d.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }));
  if (pick) {
    const el = document.querySelector('#cards button[data-id="' + pick.id + '"]');
    const art = el && el.closest('article');
    if (art) { document.querySelectorAll('.flag').forEach(x => x.classList.remove('flag')); clearTimeout(state.flagTimer); art.classList.add('flag'); state.flagTimer = setTimeout(() => art.classList.remove('flag'), 3500); }
  }
});

$('reset').addEventListener('click', () => {
  const i = state.cur;
  state.s[i] = { asg: initAsg(STAGES[i]), hints: 0, snap: null, retry: true };
  clearMsg();
  render();
});
render();
AUD.bgm('bgm_title');
let introDone = false;
const hasProgress = state.cleared.some(Boolean) || !!seen.pre001;
function introGo(fresh) {
  if (introDone) return;
  introDone = true;
  AUD.unlock();
  if (fresh) {
    state.cleared = STAGES.map(() => false);
    state.s = STAGES.map(st => ({ asg: initAsg(st), hints: 0, snap: null }));
    Object.keys(seen).forEach(k => delete seen[k]);
    try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SEEN_KEY); localStorage.removeItem(STAGE_KEY); } catch (err) { /* ignore */ }
    state.cur = 0;
  } else {
    const nxt = state.cleared.findIndex(v => !v);
    state.cur = nxt < 0 ? STAGES.length - 1 : nxt;
  }
  render();
  const el = $('intro');
  el.classList.add('out');
  setTimeout(() => { el.hidden = true; }, 950);
  puzzleBgm();
  autoScene();
}
$('intro-cont').disabled = !hasProgress;
function introNext() {
  if ($('intro').classList.contains('step2')) return;
  AUD.unlock();
  $('intro').classList.add('step2');
  $('intro').querySelector('.menu').hidden = false;
  (hasProgress ? $('intro-cont') : $('intro-new')).focus();
}
$('intro-next').addEventListener('click', introNext);
$('intro').addEventListener('click', e => { if (!e.target.closest('button')) introNext(); });
$('intro-cont').addEventListener('click', () => introGo(false));
$('intro-new').addEventListener('click', async () => {
  if (hasProgress && !(await askConfirm('これまでの記録を消して、最初から始めますか？', '消して始める'))) return;
  introGo(true);
});
$('intro-next').focus();
syncInert();
</script>
